<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ogforge — Dynamic OG Images{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="navbar-logo">ogforge</a>
            <div class="nav-links">
                {% if request.session.get('user_id') %}
                    <a href="/dashboard" class="nav-link">Dashboard</a>
                    <a href="/logout" class="nav-link">Logout</a>
                {% else %}
                    <a href="/login" class="nav-link">Login</a>
                    <a href="/signup" class="nav-link nav-link-signup">Sign Up</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>&copy; 2026 ogforge. All rights reserved.</p>
    </footer>
</body>
</html>
